name: Validate skills and release boundary

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # commit-message check reads the pushed range
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-dev.txt
      - run: python tools/scripts/check_public_tree.py --require-private-markers
        env:
          ROOTLY_SKILLS_PRIVATE_MARKERS: ${{ secrets.ROOTLY_SKILLS_PRIVATE_MARKERS }}
      - name: Check commit messages
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch or a force push has no usable "before" commit; check the head commit alone.
          if [ "$EVENT" = pull_request ]; then range="$BASE..$HEAD_SHA"
          elif [ "$EVENT" = push ] && git merge-base --is-ancestor "$BEFORE" "$HEAD_SHA" 2>/dev/null; then range="$BEFORE..$HEAD_SHA"
          else range="$HEAD_SHA^!"; fi
          python tools/scripts/check_commit_messages.py "$range"
      - run: python tools/scripts/check_release_metadata.py
      - run: python tools/scripts/build_package.py --check
      - run: python tools/scripts/validate_skills.py
      - run: python -m unittest discover -s tools/tests/static -v
      - run: python tools/scripts/export_release.py
      # No model credentials, live MCP calls, uploads, or publication from CI.
