interface:
  display_name: "Rootly Incident Response"
  short_description: "Investigate incidents and recommend mitigation"
  default_prompt: "Use $incident-response to help with this Rootly workflow."
dependencies:
  tools:
    - type: "mcp"
      value: "rootly"
      description: "Rootly incident and on-call data"
      transport: "streamable_http"
      url: "https://mcp.rootly.com/mcp"
policy:
  allow_implicit_invocation: true
