interface:
  display_name: "Rootly Service Health"
  short_description: "Summarize service signals against meaningful baselines"
  default_prompt: "Use $service-health to help with this Rootly workflow."
dependencies:
  tools:
    - type: "mcp"
      value: "rootly"
      description: "Rootly incident and on-call data"
      transport: "streamable_http"
      url: "https://mcp.rootly.com/mcp"
policy:
  allow_implicit_invocation: true
